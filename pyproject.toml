[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flow_bed"
version = "0.1.0"
description = "Flow matching with likelihood guidance for Bayesian experimental design"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Egor Antipov", email = "egor.antipov@helmholtz-munich.de" }]
dependencies = [
    "torch>=2.1",
    "torchdyn>=1.0.6",
    "numpy>=1.24",
    "lightning>=2.4",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4", "matplotlib"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = ["slow: thorough or slow tests, run with `pytest -m slow` or `pytest -m ''`"]

[tool.ruff]
line-length = 100
target-version = "py310"
