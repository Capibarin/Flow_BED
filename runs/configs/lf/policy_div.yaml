# Decoupled policy on a frozen flow as checkpoints/lf_policy_div_hutch_silu_b5_attn400k.pt: divergence utility
# (Hutchinson), sum over the rollout's steps, 400 x 781 steps (one-cycle, max lr 1e-4, 2% warm-up).
# Variants, as command-line flags on top of this file: --detach-policy-input (the best so far, sPCE 11.75 at seed 43,
# one seed), --policy-term final_random (8.86 at seed 42, 8.64 at seed 43), --greedy. The outcome model (sigma, m)
# is the flow's.
# runs/scripts/training/train_lf_policy.py --config runs/configs/lf/policy_div.yaml --out ...
#     [--flow-ckpt ...] [--seed ...]
flow_ckpt: checkpoints/train_curve_anneal_silu/ckpts/s1_400k_attn.pt
utility: divergence
divergence: hutchinson
# how the policy is trained
policy_term: sum             # sum | final | final_random
detach_policy_input: false   # no gradient through the history the policy sees
greedy: false                # sum only: each step's term trains only its own design (sets detach_policy_input)
own_encoder: false           # policy has its own history encoder instead of the flow's
policy_enc_hidden_dims: null # own_encoder only (default: as the flow's encoder)
tau_max: 1.0
tau_anneal_frac: 0.0
Q: 30
q_min: 2
epochs: 400
steps_per_epoch: 781
batch: 256
lr: 1.0e-4
policy_hidden_dims: [128, 128, 128, 128]
activation: silu
design_bound: 5.0
bound_type: radial
# density utility only
solver: dopri5
tol: 1.0e-3
n_steps: 20
ckpt_every: 10
seed: 42
